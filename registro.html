<!doctype html>
<html lang="es" data-i18n-title="registro.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crea tu página | Ophiel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/cuenta.css?v=f26">
</head>
<body>
<main class="cuenta-split">
  <div class="split-form">
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" data-i18n="lang.es">ES</button><button type="button" data-lang="en" data-i18n="lang.en">EN</button></div>
    <a class="cuenta-marca" href="/" data-i18n-attr="aria-label:common.brand" aria-label="Ophiel, inicio"><img src="assets/img/emblema-oro-64.webp" width="30" height="30" alt=""><span>Ophiel</span></a>

    <section class="tarjeta" id="vista-registro" aria-labelledby="t-registro">
      <h1 id="t-registro" data-i18n-html="registro.h1">Crea tu <em>página</em></h1>
      <p class="sub" data-i18n="registro.sub">Gratis y en menos de 3 minutos.</p>
      <p class="chip-enlace oculto" id="chip" data-i18n="registro.chip"></p>
      <form id="form-registro" novalidate>
        <div class="campo"><label for="email" data-i18n="common.email">Correo</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
        <div class="campo"><label for="password" data-i18n="common.password">Contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="ayuda-pw"><p class="ayuda" id="ayuda-pw" data-i18n="registro.help">Mínimo 8 caracteres.</p></div>
        <button class="btn btn-oro" type="submit" id="btn-registro" data-i18n="registro.btn">Crear cuenta</button>
        <p class="msg" id="msg-registro" role="alert" aria-live="polite"></p>
      </form>
      <div class="separador" data-i18n="common.or">o</div>
      <button class="btn btn-google" type="button" id="btn-google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span data-i18n="common.google">Continuar con Google</span></button>
      <p class="msg" id="msg-google" role="alert" aria-live="polite"></p>
      <p class="legal"><span data-i18n="registro.terms">Al continuar aceptas nuestra</span> <a href="privacidad" data-i18n="registro.privacy">política de privacidad</a>.</p>
      <p class="cambio"><span data-i18n="registro.have">¿Ya tienes cuenta?</span> <a href="entrar" data-i18n="common.login">Entrar</a></p>
    </section>

    <section class="tarjeta oculto" id="vista-correo" aria-labelledby="t-correo">
      <h1 id="t-correo" data-i18n-html="registro.check.h">Revisa tu <em>correo</em></h1>
      <p class="sub" id="texto-correo" data-i18n="registro.check.p"></p>
      <button class="btn" type="button" id="btn-reenviar" data-i18n="registro.check.resend">Reenviar correo</button>
      <p class="msg" id="msg-reenviar" role="status" aria-live="polite"></p>
    </section>
  </div>

  <aside class="split-art" aria-hidden="true">
    <div class="art-fan">
      <img src="assets/img/all2-lecoquette.webp" width="520" height="885" alt="" loading="lazy">
      <img src="assets/img/all2-maddox.webp" width="520" height="885" alt="" loading="lazy">
      <img src="assets/img/all2-elixea.webp" width="520" height="885" alt="" loading="lazy">
    </div>
    <div class="art-txt"><h2 data-i18n-html="registro.side.h">Todo tu negocio <em>en un enlace</em></h2><p data-i18n="registro.side.p">Páginas de negocios reales de Almería, hechas con All2.</p></div>
  </aside>
</main>
<script src="public-config.js"></script>
<script type="module" src="js/registro.js"></script>
</body>
</html>
