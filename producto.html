<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Producto — Ophiel Digital</title>

<style>
  :root{
    --navy: #030a12;
    --navy-2: #0b131c;
    --gold: #ebb35e;
    --gold-soft: #f1cd96;
    --ink: #eef1f6;
    --ink-dim: #9aa7bb;
    --dur-fast: .35s;
    --dur-base: .7s;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; overflow-x:hidden; max-width:100%;}
  body{
    margin:0;
    background:var(--navy);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
    overflow-x:hidden;
    max-width:100%;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ---------- CABEÇALHO SIMPLES ----------
     Página de produto é um destino próprio, fora da rolagem contínua
     do site principal — por isso o cabeçalho aqui é enxuto: só o logo
     (volta pra home) e um link de volta pro catálogo, sem o menu
     completo de navegação nem seletor de idioma. */
  .prod-header{
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6vw;
    background:linear-gradient(to bottom, rgba(11,22,38,.92), rgba(11,22,38,0));
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .prod-header .brand{
    display:flex; align-items:center; gap:10px;
    text-decoration:none; color:var(--ink);
    font-size:1.05rem; letter-spacing:.06em; font-weight:600;
    white-space:nowrap;
  }
  .brand-logo-wrap{ position:relative; display:inline-flex; width:42px; height:42px; flex:none; }
  .brand-logo-wrap img{ width:42px; height:42px; display:block; object-fit:contain; }
  .prod-back-link{
    display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; color:var(--ink-dim);
    font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    transition:color var(--dur-fast) var(--ease);
  }
  .prod-back-link:hover{ color:var(--gold-soft); }
  .prod-back-link svg{ width:15px; height:15px; }

  /* ---------- SEÇÃO DO PRODUTO ----------
     Mesmo padrão visual .service-showcase usado nos serviços do site
     principal: galeria à esquerda, conteúdo no meio, preço à direita. */
  .product-section{
    min-height:100vh;
    display:flex; align-items:center;
    padding:140px 12vw 100px;
    position:relative;
    overflow-x:hidden;
  }
  .service-showcase{
    display:grid;
    grid-template-columns: 280px 1fr 320px;
    gap:44px 44px;
    align-items:start;
    width:100%;
    position:relative; z-index:1;
  }
  .service-gallery{ grid-column:1; grid-row:1 / 3; }
  .sc-header{ grid-column:2; grid-row:1; }
  .sc-body{ grid-column:2; grid-row:2; }
  .price-box{ grid-column:3; grid-row:1 / 3; }

  @media (max-width:1150px){
    .service-showcase{ grid-template-columns: 240px 1fr; }
    .service-gallery{ grid-column:1; grid-row:1 / 3; }
    .sc-header{ grid-column:2; grid-row:1; }
    .sc-body{ grid-column:2; grid-row:2; }
    .service-showcase .pricing-card{ grid-column:1 / -1; grid-row:3; max-width:420px; margin:8px auto 0; }
  }
  @media (max-width:800px){
    .product-section{ padding:120px 8vw 60px; }
    .service-showcase{ grid-template-columns:1fr; }
    .service-gallery, .sc-header, .sc-body, .price-box{ grid-column:1; grid-row:auto; }
    .sc-header{ order:1; }
    .service-gallery{ order:2; max-width:none; margin:0; }
    .sc-body{ order:3; }
    .service-showcase .pricing-card{ order:4; max-width:none; margin:24px 0 0; }
    .service-gallery{ flex-direction:column; align-items:stretch; gap:10px; height:auto; }
    .service-gallery .thumbs{ display:grid; grid-template-columns:repeat(3,1fr); width:auto; flex:none; gap:8px; }
    .service-gallery .thumb{ flex:none; height:90px; aspect-ratio:auto; }
    .service-gallery .main-photo{ flex:none; height:320px; aspect-ratio:auto; }
  }

  .service-gallery{ display:flex; flex-direction:column; gap:10px; }
  .service-gallery .main-photo{
    border-radius:6px; overflow:hidden;
    border:1px solid rgba(212,175,106,.35);
    box-shadow:0 20px 44px rgba(0,0,0,.4);
    aspect-ratio:3/4;
  }
  .service-gallery .main-photo.empty{
    display:flex; align-items:center; justify-content:center;
    border-style:dashed; background:rgba(255,255,255,.015); box-shadow:none;
  }
  .service-gallery .main-photo.empty svg{ width:34px; height:34px; color:rgba(212,175,106,.3); }
  .service-gallery .main-photo img{ display:block; width:100%; height:100%; object-fit:cover; }
  .service-gallery .thumbs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .service-gallery .thumb{
    aspect-ratio:1; border-radius:4px;
    border:1px dashed rgba(212,175,106,.3);
    background:rgba(255,255,255,.02);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .service-gallery .thumb:has(img){ cursor:pointer; border-style:solid; }
  .service-gallery .thumb:has(img):hover{ transform:translateY(-2px); border-color:var(--gold); }
  .service-gallery .thumb.is-active{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .service-gallery .thumb img{ width:100%; height:100%; object-fit:cover; }
  .service-gallery .main-photo:has(img){ cursor:zoom-in; }
  .service-gallery .thumb svg{ width:16px; height:16px; color:rgba(212,175,106,.35); }

  .sc-label{ font-size:.85rem; color:var(--gold); letter-spacing:.15em; margin-bottom:10px; }
  .sc-title{ font-size:clamp(1.8rem,3.4vw,2.6rem); margin:0 0 6px; }
  .sc-subtitle{ display:block; color:var(--gold-soft); font-size:1.1rem; font-weight:500; margin-top:4px; }
  .sc-divider{
    width:44px; height:2px; background:var(--gold);
    box-shadow:0 0 8px 1px rgba(212,175,106,.7), 0 0 16px 2px rgba(212,175,106,.3);
    margin:18px 0;
  }
  .sc-desc{ color:var(--ink-dim); line-height:1.7; font-size:.98rem; margin:0 0 30px; max-width:46ch; }

  .sc-icon{
    width:40px; height:40px; border-radius:50%; flex:none;
    background:rgba(212,175,106,.08); border:1px solid rgba(212,175,106,.28);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
  }
  .sc-icon svg{ width:18px; height:18px; }
  .sc-feature{ display:flex; gap:16px; margin-bottom:24px; }
  .sc-feature h4{ color:var(--gold-soft); font-size:.95rem; margin:0 0 4px; font-weight:700; }
  .sc-feature p{ color:var(--ink-dim); font-size:.85rem; line-height:1.55; margin:0; }

  .pricing-card{
    position:relative; background:var(--navy-2);
    border:1px solid rgba(212,175,106,.3); border-radius:8px;
    padding:40px 26px 26px;
  }
  .pricing-title{ text-align:center; color:var(--ink-dim); font-size:.72rem; letter-spacing:.14em; margin:4px 0 24px; }
  .pricing-cta{
    display:block; text-align:center; text-decoration:none;
    background:var(--gold); color:var(--navy); font-weight:700;
    padding:14px 0; border-radius:6px; font-size:.88rem; letter-spacing:.02em;
    margin-bottom:14px;
  }
  .qty-plans{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .qty-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:12px 14px; border-radius:6px;
    border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.02);
  }
  .qty-row.is-anchor{ border-color:var(--gold); background:rgba(212,175,106,.08); box-shadow:0 8px 20px rgba(212,175,106,.12); }
  .qty-info{ display:flex; flex-direction:column; gap:5px; }
  .qty-num{ font-size:.86rem; font-weight:600; color:var(--ink); letter-spacing:.01em; }
  .qty-badge{
    font-size:.6rem; font-weight:700; letter-spacing:.05em; color:var(--gold);
    background:rgba(212,175,106,.15); border:1px solid rgba(212,175,106,.4);
    padding:2px 7px; border-radius:999px; width:fit-content;
  }
  .qty-prices{ text-align:right; flex:none; }
  .qty-total{ display:block; font-size:1.05rem; font-weight:700; color:var(--gold); line-height:1.25; }
  .qty-unit{ display:block; font-size:.66rem; color:var(--ink-dim); margin-top:1px; }
  .qty-note{ font-size:.74rem; color:var(--ink-dim); line-height:1.5; margin:2px 0 16px; }

  /* estado de "produto não encontrado", pra quando o ?id= da URL não bate com nada */
  .prod-not-found{
    max-width:460px; margin:0 auto; text-align:center;
    padding:60px 20px;
  }
  .prod-not-found h1{ font-size:1.6rem; margin:0 0 12px; }
  .prod-not-found p{ color:var(--ink-dim); margin:0 0 28px; line-height:1.6; }
  .prod-not-found a{
    display:inline-block; text-decoration:none;
    background:var(--gold); color:var(--navy); font-weight:700;
    padding:12px 28px; border-radius:6px; font-size:.85rem;
  }

  /* entrada suave da seção inteira ao carregar a página — sem depender
     de GSAP/ScrollTrigger aqui, é só uma página, não precisa de scroll-trigger */
  @keyframes prodFadeIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  .product-section .service-showcase{ animation:prodFadeIn .6s var(--ease) both; }

  /* ---------- LIGHTBOX — mesma visualização ampliada usada no site principal ---------- */
  .lightbox-overlay{
    position:fixed; inset:0; z-index:9999;
    background:rgba(2,6,10,.94);
    display:flex; align-items:center; justify-content:center;
    padding:40px;
    opacity:0; pointer-events:none;
    overscroll-behavior:contain;
    transition:opacity var(--dur-base) var(--ease);
  }
  .lightbox-overlay.is-open{ opacity:1; pointer-events:auto; }
  .lightbox-img{
    max-width:100%; max-height:100%; width:auto; height:auto;
    border-radius:6px; box-shadow:0 30px 80px rgba(0,0,0,.6);
    border:1px solid rgba(212,175,106,.3);
    transform:scale(.96); transition:transform var(--dur-base) var(--ease);
    touch-action:pinch-zoom;
  }
  .lightbox-overlay.is-open .lightbox-img{ transform:scale(1); }
  .lightbox-close{
    position:absolute;
    top:max(24px, env(safe-area-inset-top)); right:max(24px, env(safe-area-inset-right));
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid rgba(212,175,106,.3);
    color:var(--gold-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  }
  .lightbox-close:hover{ background:rgba(212,175,106,.15); border-color:var(--gold); }
  .lightbox-close svg{ width:20px; height:20px; }
  @media (max-width:700px){
    .lightbox-overlay{ padding:14px; }
    .lightbox-close{ top:max(14px, env(safe-area-inset-top)); right:max(14px, env(safe-area-inset-right)); width:44px; height:44px; }
  }
</style>
</head>

      pricing: [
        { qty: "1 unidad", total: "€14,90" },
        { qty: "5 unidades", total: "€29,90" },

        { qty: "30 unidades", total: "€89,90", badge: "Más popular", anchor: true },

      ]
    }
  };

  function euroToNumber(str){
    return parseFloat(str.replace("€", "").replace(/\./g, "").replace(",", "."));
  }
  function formatEuro(n){
    return "€" + n.toFixed(2).replace(".", ",");
  }
  function qtyToNumber(str){
    const match = str.match(/\d+/);
    return match ? parseInt(match[0], 10) : 1;
  }

  function emptyPhotoSVG(size){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:${size}px;height:${size}px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
  }

  function renderProduct(p){
    document.title = p.name + " — Ophiel Digital";

    const mainPhotoHTML = p.mainPhoto
      ? `<img src="data:image/jpeg;base64,${p.mainPhoto}" alt="${p.name}">`
      : emptyPhotoSVG(34);
    const mainPhotoClass = p.mainPhoto ? "main-photo" : "main-photo empty";

    const thumbsHTML = [0, 1, 2].map((i) => {
      const t = p.thumbs[i];
      if(t){
        return `<div class="thumb"><img src="data:image/jpeg;base64,${t}" alt="${p.name}"></div>`;
      }
      return `<div class="thumb">${emptyPhotoSVG(16)}</div>`;
    }).join("");

    const featuresHTML = (p.features || []).map((f) => `
      <div class="sc-feature">
        <div class="sc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div>
          <h4>${f.title}</h4>
          <p>${f.desc}</p>
        </div>
      </div>`).join("");

    const pricingHTML = p.pricing.map((row) => {
      const qtyNum = qtyToNumber(row.qty);
      const showUnit = qtyNum > 1;
      const unitHTML = showUnit
        ? `<span class="qty-unit">${formatEuro(euroToNumber(row.total) / qtyNum)}/ud</span>`
        : "";
      const badgeHTML = row.badge ? `<span class="qty-badge">${row.badge}</span>` : "";
      return `
        <div class="qty-row${row.anchor ? " is-anchor" : ""}">
          <div class="qty-info"><span class="qty-num">${row.qty}</span>${badgeHTML}</div>
          <div class="qty-prices"><span class="qty-total">${row.total}</span>${unitHTML}</div>
        </div>`;
    }).join("");

    document.getElementById("productSection").innerHTML = `
      <div class="service-showcase">
        <div class="service-gallery">
          <div class="${mainPhotoClass}">${mainPhotoHTML}</div>
          <div class="thumbs">${thumbsHTML}</div>
        </div>

        <div class="sc-header">
          <div class="sc-label">PRODUCTO</div>
          <h1 class="sc-title">${p.name}<span class="sc-subtitle">${p.subtitle}</span></h1>
          <div class="sc-divider"></div>
        </div>

        <div class="sc-body">
          <p class="sc-desc">${p.description}</p>
          ${featuresHTML}
        </div>

        <div class="price-box pricing-card">
          <div class="pricing-title">PRECIOS</div>
          <div class="qty-plans">${pricingHTML}</div>
          <a href="index.html#contato" class="pricing-cta">Solicitar ahora</a>
        </div>
      </div>`;

    setupGallery();
  }

  function renderNotFound(){
    document.title = "Producto no encontrado — Ophiel Digital";
    document.getElementById("productSection").innerHTML = `
      <div class="prod-not-found">
        <h1>Producto no encontrado</h1>
        <p>Puede que el enlace esté mal escrito o que el producto ya no esté disponible.</p>
        <a href="index.html#catalogo-3d">Volver al catálogo</a>
      </div>`;
  }

  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");
  const product = productId ? PRODUCTS[productId] : null;

  if(product){
    renderProduct(product);
  } else {
    renderNotFound();
  }

  /* ---------- LIGHTBOX (zoom nas fotos) — mesma lógica do site principal ---------- */
  const lightboxOverlay = document.getElementById("lightboxOverlay");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxClose = document.getElementById("lightboxClose");
  let lightboxScrollY = 0;

  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || "";
    lightboxOverlay.classList.add("is-open");
    lightboxScrollY = window.scrollY;
    document.body.style.position = "fixed";
    document.body.style.top = `-${lightboxScrollY}px`;
    document.body.style.left = "0";
    document.body.style.right = "0";
  }
  function closeLightbox(){
    lightboxOverlay.classList.remove("is-open");
    document.body.style.position = "";
    document.body.style.top = "";
    document.body.style.left = "";
    document.body.style.right = "";
    const prevBehavior = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = "auto";
    window.scrollTo(0, lightboxScrollY);
    document.documentElement.style.scrollBehavior = prevBehavior;
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightboxOverlay.addEventListener("click", (e) => {
    if(e.target === lightboxOverlay) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && lightboxOverlay.classList.contains("is-open")) closeLightbox();
  });

  function setupGallery(){
    const mainPhoto = document.querySelector(".main-photo");
    const thumbs = document.querySelectorAll(".thumb");
    if(mainPhoto){
      mainPhoto.addEventListener("click", () => {
        const img = mainPhoto.querySelector("img");
        if(!img) return;
        openLightbox(img.src, img.alt);
      });
    }
    thumbs.forEach((thumb) => {
      const img = thumb.querySelector("img");
      if(!img) return;
      thumb.addEventListener("click", () => {
        const mp = document.querySelector(".main-photo");
        const mpImg = mp.querySelector("img");
        if(mpImg){
          const tmp = mpImg.src;
          mpImg.src = img.src;
          img.src = tmp;
        }
      });
    });
  }
</script>
