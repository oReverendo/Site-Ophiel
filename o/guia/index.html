<style>
:root{
  --bg:#030a12; --card:#0b131c; --card2:#111d2a;
  --gold:#ebb35e; --gold-soft:#f3cf8f;
  --text:#f1ece2; --muted:#9aa6b3;
  --line:rgba(235,179,94,.17); --line-soft:rgba(255,255,255,.07);
  --red:#e8706a; --green:#74d3a0;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(235,179,94,.10),transparent 60%);
  background-repeat:no-repeat;
}
a,button{touch-action:manipulation;color:inherit;font:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
a{text-decoration:none}
svg{display:block;flex:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 18px}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

/* Home */
.hero{padding:calc(env(safe-area-inset-top) + 34px) 0 6px;text-align:center}
.logo{width:58px;height:58px;margin:0 auto 14px}
.brand{font-size:12px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;font-weight:600}
.hero h1{font-size:34px;line-height:1.1;margin:8px 0 10px;font-weight:600}
.hero p{color:var(--muted);font-size:15px;max-width:30ch;margin:0 auto}

.search{position:relative;margin:24px 0 14px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:19px;height:19px}
.search input{
  width:100%;height:50px;border-radius:14px;border:1px solid var(--line-soft);
  background:var(--card);color:var(--text);padding:0 14px 0 44px;font-size:16px;outline:none;
  -webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s;
}
.search input::placeholder{color:#6f7b88}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(235,179,94,.14)}
.results{display:grid;gap:8px;margin-bottom:16px}
.res{display:block;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line-soft)}
.res small{display:block;color:var(--gold);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.res span{font-size:15px;line-height:1.35}
.nores{color:var(--muted);font-size:14px;padding:6px 2px}

.rule{
  display:flex;gap:12px;padding:15px 16px;border-radius:16px;margin:8px 0 22px;
  background:linear-gradient(135deg,rgba(235,179,94,.14),rgba(235,179,94,.04));
  border:1px solid var(--line);
}
.rule .ic{color:var(--gold);margin-top:2px}
.rule b{display:block;color:var(--gold-soft);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.rule p{font-size:14.5px;line-height:1.5;color:#e4ded2}

.rule.big{display:block;padding:20px 18px;background:linear-gradient(135deg,rgba(235,179,94,.22),rgba(235,179,94,.06));border-color:rgba(235,179,94,.4)}
.rule .rh{display:flex;align-items:center;gap:8px;color:var(--gold)}
.rule .rh .ic{margin:0;width:20px;height:20px;stroke-width:2.4}
.rule .rh b{margin:0}
.rule.big h2{font-size:30px;line-height:1.1;margin:8px 0 8px;font-weight:600;color:var(--gold-soft)}
.rule.big>p{font-size:15px}
.swaps{display:grid;gap:10px;margin-top:16px}
.sw{padding:12px 13px;border-radius:13px;background:rgba(3,10,18,.55);border:1px solid var(--line-soft)}
.sw .q{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.sw .a{display:block;font-size:14.5px;line-height:1.45;color:#f3eee4}
.sw .a::before{content:"→ ";color:var(--gold);font-weight:700}
.plans{display:grid;gap:12px}
.plan{padding:16px 16px 4px;border-radius:18px;background:var(--card);border:1px solid var(--line-soft);transition:border-color .2s}
.plan.open{border-color:var(--line)}
.plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.plan-top .pn{min-width:0}
.plan-top h3{font-size:17px;line-height:1.25;font-weight:600}
.plan .per{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-soft);background:rgba(235,179,94,.13);border:1px solid var(--line)}
.plan .amt{font-size:30px;line-height:1.05;font-weight:600;color:var(--gold-soft);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.plan .benefit{margin-top:12px;font-size:14.5px;line-height:1.5;color:#cfc9be}
.inc-h{width:100%;display:flex;align-items:center;gap:10px;min-height:50px;margin-top:8px;border-top:1px solid var(--line-soft);font-size:14.5px;font-weight:600;color:var(--gold)}
.inc-h span{flex:1}
.inc-h .ic{transition:transform .28s var(--ease)}
.plan.open .inc-h .ic{transform:rotate(180deg)}
.plan.open .acc-b{grid-template-rows:1fr}
.plan .acc-pad{padding:2px 0 14px}
.plan .list li{font-size:14.5px}
.sec-grid{display:grid;gap:12px;padding-bottom:10px}
.sec{
  display:flex;align-items:center;gap:14px;padding:14px 16px 14px 14px;border-radius:18px;
  background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line-soft);
  transition:transform .16s var(--ease),border-color .2s;
}
.sec:active{transform:scale(.975)}
.sec.gold{background:linear-gradient(135deg,rgba(235,179,94,.24),rgba(235,179,94,.07));border-color:rgba(235,179,94,.45)}
.sec.gold .badge{background:radial-gradient(circle at 30% 20%,rgba(235,179,94,.42),rgba(235,179,94,.14));border-color:rgba(235,179,94,.5)}
.sec.gold h2{color:var(--gold-soft)}
.sec.gold p{color:#e4ded2}
.sec .badge{
  width:72px;height:72px;border-radius:20px;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 30% 20%,rgba(235,179,94,.28),rgba(235,179,94,.08));
  border:1px solid var(--line);color:var(--gold);
}
.sec .badge svg.big{width:58px;height:58px}
.sec h2{font-size:19px;line-height:1.2;font-weight:600}
.sec p{color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:3px}
.sec .go{margin-left:auto;color:var(--gold);opacity:.8}
.foot{padding:28px 0 calc(env(safe-area-inset-bottom) + 30px);text-align:center;color:#5f6c79;font-size:12.5px}

/* Bar */
.bar{
  position:sticky;top:0;z-index:20;
  background:rgba(3,10,18,.86);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top);
}
.bar-row{display:flex;align-items:center;gap:6px;height:54px}
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;margin-left:-6px;color:var(--gold);font-weight:600;font-size:15px;border-radius:10px}
.back:active{opacity:.6}
.bar-title{font-size:18px;font-weight:600;flex:1;text-align:center;padding-right:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 18px 10px;margin:0 -18px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;height:38px;padding:0 15px;border-radius:999px;display:flex;align-items:center;
  font-size:14.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line-soft);
  transition:background .2s,color .2s,border-color .2s,transform .12s var(--ease);
}
.tab:active{transform:scale(.95)}
.tab[aria-selected=true]{background:var(--gold);color:#1b1305;border-color:var(--gold)}

/* Content */
.view{animation:rise .32s var(--ease) both}
.panel{padding:20px 0 4px;animation:fade .24s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel>*+*{margin-top:18px}
.lbl{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:-6px}
.p{color:#d8d3c9;font-size:15.5px}
.callout{
  padding:17px 18px;border-radius:16px;font-size:16.5px;line-height:1.5;
  background:linear-gradient(135deg,rgba(235,179,94,.16),rgba(235,179,94,.05));
  border:1px solid var(--line);border-left:3px solid var(--gold);
}
.list{list-style:none;display:grid;gap:9px}
.list li{position:relative;padding-left:22px;font-size:15.5px;color:#e2ddd2}
.list li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(235,179,94,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;font-size:13.5px;background:var(--card);border:1px solid var(--line);color:#e8e2d6}

.card{padding:18px 17px;border-radius:18px;background:var(--card);border:1px solid var(--line-soft)}
.card h3{font-size:18px;line-height:1.25;font-weight:600;margin-bottom:7px}
.card>p{color:#cfc9be;font-size:15px;line-height:1.55}
.card .quote{margin-top:13px}
.cards{display:grid;gap:12px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(235,179,94,.35)}100%{box-shadow:0 0 0 0 transparent}}

.quote{position:relative;padding:13px 14px 13px 16px;border-radius:14px;background:rgba(235,179,94,.07);border-left:3px solid var(--gold)}
.quote figcaption{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:5px}
.quote p{font-size:15.5px;line-height:1.55;font-style:italic;color:#f3eee4;padding-right:2px}
.copy{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:36px;padding:0 13px;border-radius:10px;
  background:rgba(235,179,94,.14);color:var(--gold-soft);font-size:13.5px;font-weight:600;
  transition:transform .12s var(--ease),background .2s;
}
.copy .ic{width:16px;height:16px}
.copy:active{transform:scale(.94)}
.copy.done{background:rgba(116,211,160,.2);color:var(--green)}

.acc{border-radius:16px;background:var(--card);border:1px solid var(--line-soft);overflow:hidden;transition:border-color .2s}
.acc+.acc{margin-top:10px}
.acc.open{border-color:var(--line)}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:16px;min-height:58px;font-size:16px;font-weight:600;line-height:1.3}
.acc-h span{flex:1}
.acc-h .ic{color:var(--gold);transition:transform .28s var(--ease)}
.acc.open .acc-h .ic{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-i{min-height:0;overflow:hidden}
.acc-pad{padding:0 16px 16px}
.note{margin-top:11px;font-size:14px;color:var(--muted);line-height:1.5}
.note b{color:var(--gold-soft);font-weight:600}

.cmp{display:grid;gap:12px}
.cmp>div{padding:17px;border-radius:18px;background:var(--card);border:1px solid var(--line-soft)}
.cmp h3{font-size:17px;line-height:1.25;font-weight:600}
.cmp .sub{color:var(--gold-soft);font-size:13.5px;margin:3px 0 11px}
.cmp .list li{font-size:14.5px}
.cmp .list{gap:7px}
@media(min-width:600px){.cmp{grid-template-columns:1fr 1fr}}

.dos{display:grid;gap:12px}
.do{padding:16px;border-radius:18px;border:1px solid}
.do h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.do h3 .ic{width:18px;height:18px;stroke-width:2.4}
.do ul{list-style:none;display:grid;gap:10px}
.do li{font-size:15px;line-height:1.45;color:#ece7dc;padding-left:2px}
.do.no{background:rgba(232,112,106,.07);border-color:rgba(232,112,106,.3)}
.do.no h3{color:var(--red)}
.do.yes{background:rgba(116,211,160,.06);border-color:rgba(116,211,160,.28)}
.do.yes h3{color:var(--green)}
@media(min-width:600px){.dos{grid-template-columns:1fr 1fr}}

.prices{display:grid;gap:12px}
.price{padding:19px 18px;border-radius:18px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.price small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.price .amt{font-size:38px;font-weight:600;line-height:1.1;margin:5px 0 8px;color:var(--gold-soft)}
.price .amt i{font-style:normal;font-size:15px;color:var(--muted);margin-right:6px;font-family:-apple-system,"Segoe UI",sans-serif}
.price p{color:#cfc9be;font-size:14.5px;line-height:1.5}

.chat{display:grid;gap:9px}
.bub{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5}
.bub small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:2px;opacity:.75}
.bub.c{background:var(--card2);border:1px solid var(--line-soft);border-bottom-left-radius:5px;justify-self:start}
.bub.v{background:rgba(235,179,94,.17);border:1px solid var(--line);border-bottom-right-radius:5px;justify-self:end;color:#fbf3e3}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media(hover:hover){
  .sec:hover{border-color:var(--line)}
  .tab:hover{color:var(--text)}
  .res:hover{border-color:var(--line)}
}
</style>
</head>

    {title:'Las reseñas dan confianza', text:'⭐ buenas reseñas · 📸 buenas fotos · 🕒 horarios correctos · 📍 ubicación correcta · 💬 respuestas del negocio. Con la gestión mensual nos encargamos de responderlas.'},
    {title:'Ejemplo fácil', text:'Alguien busca «peluquería cerca de mí» o «restaurante en Adra». Google muestra varios negocios en Maps. Queremos que la ficha esté completa, profesional y optimizada para tener mejores posibilidades de aparecer y generar contactos.'},
    {title:'Funciona mejor con web y redes', text:'Google Business ayuda en Maps y búsquedas locales; la web presenta toda la información en profundidad; el SEO ayuda a Google a entenderla. Una estrategia completa es mucho más fuerte que depender solo de Instagram o Facebook.'}

/* ---------------------------- POR QUÉ OPHIEL ---------------------------- */
{
 id:'ophiel', icon:'star', title:'Por qué Ophiel',
 short:'Cercanía, diferenciales y cómo responder a la competencia',
 tabs:[
  {id:'dif', label:'Diferenciales', blocks:[
   {t:'callout', text:'Queremos que el cliente piense: «tengo una empresa profesional cerca, que entiende mi negocio, me atiende directamente y tiene un precio muy competitivo». No: «Ophiel es barata».'},
   {t:'quote', label:'Nuestra venta en una frase', text:'Ofrecemos a empresas de la zona servicios digitales profesionales, personalizados y con atención cercana, manteniendo una relación calidad-precio muy competitiva.'},
   {t:'cards', items:[
    {title:'Somos cercanos', text:'El cliente puede hablar directamente con nosotros.'},
    {title:'Conocemos la zona', text:'Entendemos mejor el mercado local: Almería, El Ejido, Roquetas, Adra, Balanegra, Aguadulce…'},
    {title:'Trabajo personalizado', text:'Cada proyecto se adapta a la empresa.'},
    {title:'Precio competitivo', text:'Buena relación entre inversión y calidad.'},
    {title:'Atención directa', text:'Menos intermediarios, menos malentendidos.'},
    {title:'Posibilidad de visita', text:'Podemos conocer físicamente el negocio cuando el proyecto lo requiere.'},
    {title:'SEO local', text:'Trabajamos estratégicamente las localidades donde opera el cliente.'},
    {title:'Servicio completo', text:'Web, Google, redes, fotografía, vídeo, cartas digitales, QR y NFC en un solo proveedor.'},
    {title:'Pensamos en resultados', text:'No hacemos algo bonito solo para enseñar: queremos que sirva al negocio.'}
   ]}
  ]},
  {id:'argumentos', label:'Argumentos', blocks:[
   {t:'cards', items:[
    {title:'Cercanía real', text:'Conocemos la zona, el tipo de cliente de la provincia, la competencia y las necesidades reales de pequeñas y medianas empresas.', say:'Una de nuestras principales ventajas es que estamos cerca. Conocemos la zona y el tipo de cliente que existe aquí, y podemos entender mucho mejor las necesidades de un negocio local.'},
    {title:'Sabe quién está detrás', text:'En una agencia grande el cliente pasa por comercial, administración, soporte, diseño… Aquí el trato es directo: menos intermediarios y menos «esto no es lo que yo pedí».', say:'Aquí sabe con quién está trabajando y puede explicarnos directamente qué quiere cambiar o a qué darle más importancia.'},
    {title:'Podemos ir a su negocio', text:'Visitamos el local, hacemos fotos y vídeos y conocemos el ambiente. No es lo mismo crear la web de un restaurante con cuatro fotos de WhatsApp que entrar, ver los platos y hablar con el propietario.', say:'Podemos trabajar completamente online, pero si necesitamos conocer su negocio, grabar contenido o reunirnos, estamos cerca.'},
    {title:'Trabajo personalizado', text:'No hace falta lo mismo para un restaurante, una gestoría, un abogado, una constructora o un entrenador personal. Estudiamos cada proyecto de forma individual.', say:'No intentamos venderle un paquete estándar. Primero entendemos qué necesita realmente su negocio y después construimos la solución.'},
    {title:'Precio competitivo, no «barato»', text:'Con menos estructura y gastos que una gran agencia, más parte del presupuesto va al proyecto. Nunca decir «somos baratos»: decir «muy buena relación calidad-precio».', say:'Nuestra estructura nos permite ofrecer un servicio muy completo sin que el cliente tenga que pagar el coste añadido de una gran agencia.'},
    {title:'Hablamos claro', text:'Entendemos a autónomos, comercios, restaurantes y pymes: cada euro cuenta. El cliente no quiere código ni metadatos, quiere más visibilidad, más contactos y más clientes. Cada servicio tiene un objetivo comercial claro.'},
    {title:'Para empresas de Almería', say:'Muchas empresas de nuestra provincia terminan contratando servicios digitales fuera, cuando aquí también existen profesionales capaces de ofrecer un trabajo de alta calidad. Nuestra ventaja es combinar profesionalidad, conocimiento del mercado local, atención directa y precios competitivos.'}
   ]}
  ]},
  {id:'objeciones', label:'Objeciones', blocks:[
   {t:'qa', items:[
    {q:'«Estoy mirando una empresa de Madrid»', a:'Por supuesto, hay empresas muy buenas en Madrid. La diferencia es que nosotros podemos ofrecerle un servicio mucho más cercano, conocemos el mercado de la zona, podemos atenderle directamente y mantenemos unos precios muy competitivos.', note:'<b>Nunca</b> decir que Madrid es carísimo ni que nosotros trabajamos mejor.'},
    {q:'«Pero todo se puede hacer por internet»', a:'Claro que sí, nosotros también podemos trabajar completamente online. La diferencia es que si en algún momento necesitamos conocer su negocio, grabar contenido, hacer fotografías o reunirnos, estamos cerca. Tiene las ventajas del servicio digital sin perder el trato cercano.'},
    {q:'«Me han ofrecido una web por 300 €»', a:'Puede ser una opción perfectamente válida, pero habría que comparar qué incluye. ¿Es personalizada? ¿Incluye SEO? ¿Está optimizada para móvil? ¿Incluye Search Console, Analytics, seguridad y soporte? Muchas veces dos presupuestos parecen lo mismo, pero ofrecen cosas muy diferentes.'},
    {q:'«Mi sobrino me puede hacer una página»', a:'Perfecto, si tiene conocimientos profesionales puede ser una opción. Lo importante es asegurarse de que no sea solo una página visual, sino que tenga SEO, seguridad, rendimiento, adaptación móvil, configuración de Google y una estructura preparada para posicionamiento.', note:'No criticamos al sobrino: hacemos que el cliente vea que una web profesional tiene muchas más partes.'},
    {q:'«No quiero gastar dinero ahora»', a:'Una web no es solo un gasto, puede ser una inversión. Si consigue que nuevos clientes encuentren el negocio, contacten y compren, puede terminar amortizando su propio coste.', note:'Ejemplo: 800 € en una web que trae varios clientes nuevos.'},
    {q:'«Ellos cobran 700 y vosotros 800»', a:'Compare no solo el precio, sino todo lo que incluye el servicio. Nosotros ofrecemos trabajo personalizado, SEO, optimización, soporte cercano y la posibilidad de trabajar con una empresa de su zona.', note:'<b>No entrar en guerra de precios</b>: siempre habrá alguien a 600, a 500, a 300. Vendemos calidad + servicio + cercanía + precio competitivo.'}
   ]}
  ]},
  {id:'preguntas', label:'Preguntas', blocks:[
   {t:'cards', items:[
    {title:'«¿La empresa que le ha pasado presupuesto está aquí, en la zona?»', text:'Si responde que no, esta es la salida:', say:'Entonces una de las ventajas que tendría con nosotros es precisamente la cercanía. Si necesitamos conocer su negocio, visitarlo, hacer contenido o entender mejor cómo funciona, estamos aquí.'},
    {title:'«¿Qué incluye exactamente el presupuesto que le han dado?»', text:'Muchas veces el cliente compara 900 € con 700 € sin saber si es el mismo producto: una oferta puede ser solo diseño y otra incluir SEO, móvil, Google, seguridad, Analytics, Search Console y soporte. Hay que enseñarle a comparar.'},
    {title:'Precio vs. valor', text:'Precio es cuánto cuesta; valor es lo que recibe el cliente. Queremos que deje de preguntar «¿cuánto cuesta?» y pase a «¿qué voy a recibir?».'}
   ]},
   {t:'h', text:'Qué debe preguntar el cliente a cualquier proveedor'},
   {t:'list', items:['¿El diseño es personalizado?','¿Qué trabajo de SEO incluye?','¿Qué soporte hay después de la entrega?','¿Quién será realmente mi contacto?']},
   {t:'h', text:'Ejemplo de conversación'},
   {t:'chat', lines:[
    ['c','Estoy esperando presupuesto de una empresa de Madrid.'],
    ['v','Perfecto, es bueno comparar. Cuando lo tenga, fíjese en qué incluye: dos webs pueden parecer iguales sobre el papel, pero una puede incluir solo diseño y otra SEO, posicionamiento, optimización, Google y soporte.'],
    ['c','¿Y qué ventaja tendría haciéndolo con vosotros?'],
    ['v','Principalmente la cercanía y la personalización. Estamos en la zona, podemos conocer su negocio, entendemos el mercado local y trabajamos cada proyecto para cada empresa. Además, mantenemos precios muy competitivos porque tenemos una estructura más ágil.'],
    ['c','Pero si todo se puede hacer por internet.'],
    ['v','Claro, también podemos trabajar online. La diferencia es que si necesitamos conocer su negocio, grabar contenido o reunirnos, estamos cerca. Tiene las ventajas del servicio digital sin perder el trato cercano.']
   ]}
  ]},
  {id:'ojo', label:'Ojo', blocks:[
   {t:'dos',
    no:{title:'Nunca decir', items:['«Somos mejores que cualquier empresa de Madrid»','«Garantizamos que va a vender»','«Le garantizamos la primera posición en Google»','«Somos los más baratos»','«Todas las agencias grandes trabajan con plantillas»','Nada que ataque a otro profesional: resta profesionalidad']},
    yes:{title:'Sí decir', items:['«Compare qué incluye cada propuesta»','«Pregunte si el diseño es personalizado»','«Compruebe qué trabajo SEO incluye»','«Pregunte por el soporte después de la entrega»','«Compruebe quién será realmente su contacto»','«Compare el precio, pero también el valor»']}}
  ]}
 ]
}

/* ---------------------------- TÉCNICAS DE VENTA ---------------------------- */
{
 id:'tecnicas', icon:'zap', title:'Técnicas de venta',
 short:'Cómo abrir, persuadir y cerrar, en pocas palabras',
 tabs:[
  {id:'tres', label:'En 3 pasos', blocks:[
   {t:'callout', text:'Todo se reduce a esto: pregunta, enseña, propón el siguiente paso. El que más pregunta, más vende.'},
   {t:'cards', items:[
    {title:'1 · Pregunta', text:'No empieces con un discurso. Deja que el cliente cuente su situación; cuando lo dice él, la solución la quiere él.', say:'¿Cómo os encuentran hoy los clientes nuevos? Y si alguien busca su negocio en Google ahora mismo, ¿qué cree que va a encontrar?'},
    {title:'2 · Enseña', text:'Un ejemplo real en el móvil vale más que cinco explicaciones. Habla de lo suyo (clientes, llamadas, WhatsApps), no de lo nuestro (código, SEO).', say:'Le enseño cómo quedó la de otro negocio de la zona, en el móvil, que se ve mejor que contarlo.'},
    {title:'3 · Propón el siguiente paso', text:'Nunca te despidas sin un paso concreto: propuesta, llamada o reunión con día y hora.', say:'Le preparo la propuesta hoy y se la mando por WhatsApp. ¿A este número?'}
   ]}
  ]},
  {id:'persuadir', label:'Persuadir', blocks:[
   {t:'callout', text:'Persuadir es ayudar a decidir. Nada de urgencias inventadas ni ofertas falsas: si hay un motivo real, lo cuentas; si no, no.'},
   {t:'cards', items:[
    {title:'Prueba social', text:'La gente confía en lo que ya hacen otros como ella. Usa solo clientes que hayan dado permiso.', say:'Ya trabajamos con negocios de la zona. Le puedo enseñar cómo les quedó.'},
    {title:'Da algo primero', text:'Una mini revisión de 2 minutos genera confianza: mira su ficha de Google delante de él y comenta qué falta.', say:'¿Me deja que le eche un vistazo rápido a cómo sale su negocio en Google? Le digo qué mejoraría, sin compromiso.'},
    {title:'El coste de no hacer nada', text:'Cada persona que busca y no encuentra al negocio se va con otro. Dilo con calma, sin dramatizar.', say:'Cada semana alguien busca lo que usted vende. La pregunta es a quién va a llamar.'},
    {title:'Pequeños síes', text:'Consigue varios síes fáciles antes del grande y la propuesta llega sola.', say:'¿Le parece importante que le encuentren en Google? ¿Y que se vea bien en el móvil? ¿Y recibir los contactos por WhatsApp? Pues justo eso es lo que dejamos hecho.'},
    {title:'Dos opciones, no una', text:'En vez de «sí o no», que elija entre dos caminos que a ti te sirven.', say:'¿Prefiere empezar por una landing, o por una web completa?'}
   ]}
  ]},
  {id:'cerrar', label:'Cerrar', blocks:[
   {t:'callout', text:'Cerrar no es presionar. Es resumir lo que el cliente quiere y preguntar si empezamos.'},
   {t:'cards', items:[
    {title:'Resume y pregunta', say:'Entonces: quiere que le encuentren en su zona, que se vea bien en el móvil y recibir WhatsApps. Eso es exactamente lo que le dejamos hecho. ¿Empezamos?'},
    {title:'Di el precio y cállate', text:'Después de decir el precio, silencio. Quien habla primero rebaja sin que se lo pidan.'},
    {title:'Pregunta qué falta', say:'¿Qué le haría falta para decidirse hoy?'},
    {title:'Siguiente paso con fecha', say:'Quedamos el jueves por la mañana y le resuelvo cualquier duda. ¿Le va bien a las 10?'}
   ]}
  ]},
  {id:'dudas', label:'Dudas', blocks:[
   {t:'qa', items:[
    {q:'«Lo voy a pensar»', a:'Claro. Para ayudarle a decidir, ¿qué es lo que le gustaría pensar: el precio, lo que incluye o el momento?', note:'Busca la duda real y cierra una fecha para volver a hablar.'},
    {q:'«Lo tengo que hablar con mi socio / mi mujer»', a:'Perfecto. ¿Le preparo un resumen de una página para que se lo enseñe? Y quedamos en hablar el jueves para resolver cualquier duda.'},
    {q:'«Ahora no es buen momento»', a:'Lo entiendo. ¿Qué tendría que cambiar para que sí lo fuera? Mientras tanto le dejo la propuesta preparada para cuando quiera.'},
    {q:'«No me interesa»', a:'Sin problema. Solo por curiosidad: ¿ya tiene resuelta su presencia en Google y redes, o prefiere verlo más adelante?', note:'Recuerda la regla nº 1: nunca decimos NO, tampoco aceptamos el primer no sin una pregunta.'}
   ]}
  ]}
 ]
}

  shield:`<svg class="big" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gh1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd6ff"/></linearGradient><linearGradient id="gh2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63b0ff"/><stop offset="1" stop-color="#2352e6"/></linearGradient></defs><ellipse cx="32" cy="59.5" rx="19" ry="2.6" fill="#000" opacity=".3"/><path d="M32 4L53 11.5V30C53 43.5 44 53.5 32 60C20 53.5 11 43.5 11 30V11.5Z" fill="url(#gh1)"/><path d="M32 9.5L48 15.5V30C48 40.5 41 48.5 32 54C23 48.5 16 40.5 16 30V15.5Z" fill="url(#gh2)"/><path d="M23.5 31L29.5 37L41 24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g stroke="#ffc928" stroke-width="2.6" stroke-linecap="round"><path d="M5 24L9 26"/><path d="M5 34L10 34"/><path d="M59 24L55 26"/><path d="M59 34L54 34"/></g></svg>`
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const LOGO = `<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="#ebb35e" stroke-width="2.4"/><circle cx="32" cy="32" r="23" fill="none" stroke="#ebb35e" stroke-width="1.2" opacity=".75"/><path d="M32 15l3.6 13.4L49 32l-13.4 3.6L32 49l-3.6-13.4L15 32l13.4-3.6z" fill="#ebb35e"/></svg>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const app = document.getElementById('app');

function quote(text,label){
  return `<figure class="quote"><figcaption>${esc(label||'Cómo decirlo')}</figcaption><p>“${esc(text)}”</p>
  <button class="copy" type="button" data-act="copy" data-text="${esc(text)}">${ic('copy')}<span>Copiar</span></button></figure>`;
}
const list = items => `<ul class="list">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;

function block(b,sid,tid,bi){
  switch(b.t){
    case 'callout': return `<div class="callout">${esc(b.text)}</div>`;
    case 'h': return `<div class="lbl">${esc(b.text)}</div>`;
    case 'p': return `<p class="p">${esc(b.text)}</p>`;
    case 'list': return list(b.items);
    case 'chips': return `<div class="chips">${b.items.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div>`;
    case 'quote': return quote(b.text,b.label);
    case 'cards': return `<div class="cards">${b.items.map((it,ii)=>
      `<article class="card" id="it-${sid}-${tid}-${bi}-${ii}"><h3>${esc(it.title)}</h3>${it.text?`<p>${esc(it.text)}</p>`:''}${it.say?quote(it.say):''}</article>`).join('')}</div>`;
    case 'qa': return `<div>${b.items.map((it,ii)=>
      `<div class="acc" id="it-${sid}-${tid}-${bi}-${ii}"><button class="acc-h" type="button" data-act="acc" aria-expanded="false"><span>${esc(it.q)}</span>${ic('down')}</button>
      <div class="acc-b"><div class="acc-i"><div class="acc-pad">${quote(it.a,'Qué responder')}${it.note?`<p class="note">${it.note.indexOf('<b>')>-1?it.note:esc(it.note)}</p>`:''}</div></div></div></div>`).join('')}</div>`;
    case 'cmp': return `<div class="cmp">${[b.left,b.right].map(c=>`<div><h3>${esc(c.title)}</h3><div class="sub">${esc(c.sub)}</div>${list(c.items)}</div>`).join('')}</div>`;
    case 'dos': return `<div class="dos">
      <div class="do no"><h3>${ic('x')}${esc(b.no.title)}</h3><ul>${b.no.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
      <div class="do yes"><h3>${ic('check')}${esc(b.yes.title)}</h3><ul>${b.yes.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></div>`;
    case 'price': return `<div class="prices">${b.items.map(p=>`<div class="price"><small>${esc(p.name)}</small><div class="amt serif">${p.prefix?`<i>${esc(p.prefix)}</i>`:''}${esc(p.price)}</div><p>${esc(p.note)}</p></div>`).join('')}</div>`;
    case 'plans': return `<div class="plans">${b.items.map((p,ii)=>`<article class="plan" id="it-${sid}-${tid}-${bi}-${ii}"><div class="plan-top"><div class="pn"><h3>${esc(p.name)}</h3><span class="per">${esc(p.per)}</span></div><div class="amt serif">${esc(p.price)}</div></div><p class="benefit">${esc(p.benefit)}</p><button class="inc-h" type="button" data-act="acc" aria-expanded="false"><span>Qué incluye</span>${ic('down')}</button><div class="acc-b"><div class="acc-i"><div class="acc-pad"><ul class="list">${p.inc.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></div></div></article>`).join('')}</div>`;
    case 'chat': return `<div class="chat">${b.lines.map(l=>`<div class="bub ${l[0]}"><small>${l[0]==='c'?'Cliente':'Vendedora'}</small>${esc(l[1])}</div>`).join('')}</div>`;
  }
  return '';
}

/* --- Vistas --- */
function home(){
  return `<div class="view wrap">
    <header class="hero">${LOGO}<div class="brand">Ophiel</div>
      <h1 class="serif">Guía de ventas</h1>
      <p>Argumentos listos para usar con cada cliente.</p></header>
    <div class="search">${ic('search')}<input id="q" type="search" placeholder="Buscar: «Madrid», «300 €», «SEO»…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
    <div id="results" class="results" hidden></div>
    <div id="homebody">
            <nav class="sec-grid">${SECTIONS.map(s=>`<a class="sec${s.id==='reglas'?' gold':''}" href="#/${s.id}"><span class="badge">${BIG[s.icon]||ic(s.icon)}</span><span><h2 class="serif">${esc(s.title)}</h2><p>${esc(s.short)}</p></span><span class="go">${ic('next')}</span></a>`).join('')}</nav>
    </div>
    <div class="foot">Uso interno del equipo Ophiel · No compartir este enlace</div>
  </div>`;
}

function section(s,tid){
  const tab = s.tabs.find(t=>t.id===tid) || s.tabs[0];
  return `<div class="view">
    <div class="bar"><div class="wrap">
      <div class="bar-row"><a class="back" href="#/">${ic('back')}Inicio</a><div class="bar-title serif">${esc(s.title)}</div></div>
      <div class="tabs" role="tablist">${s.tabs.map(t=>`<a class="tab" role="tab" href="#/${s.id}/${t.id}" data-tab aria-selected="${t.id===tab.id}">${esc(t.label)}</a>`).join('')}</div>
    </div></div>
    <main class="wrap"><div class="panel" id="panel">${tab.blocks.map((b,bi)=>block(b,s.id,tab.id,bi)).join('')}</div>
    <div class="foot">Uso interno del equipo Ophiel · No compartir este enlace</div></main>
  </div>`;
}

/* --- Búsqueda --- */
const INDEX=[];
SECTIONS.forEach(s=>s.tabs.forEach(t=>t.blocks.forEach((b,bi)=>{
  if(b.t==='cards') b.items.forEach((it,ii)=>INDEX.push({s,t,id:`it-${s.id}-${t.id}-${bi}-${ii}`,title:it.title,hay:norm([it.title,it.text,it.say].join(' '))}));
  if(b.t==='plans' && s.id==='precios') b.items.forEach((it,ii)=>INDEX.push({s,t,id:`it-${s.id}-${t.id}-${bi}-${ii}`,title:it.name+' · '+it.price,hay:norm([it.name,it.price,it.per,it.benefit,it.inc.join(' ')].join(' '))}));
  if(b.t==='qa') b.items.forEach((it,ii)=>INDEX.push({s,t,id:`it-${s.id}-${t.id}-${bi}-${ii}`,title:it.q,hay:norm([it.q,it.a,it.note].join(' '))}));
})));
function doSearch(v){
  const box=document.getElementById('results'), body=document.getElementById('homebody');
  const q=norm(v.trim());
  if(q.length<2){box.hidden=true;body.hidden=false;return}
  const words=q.split(/\s+/);
  const hits=INDEX.filter(i=>words.every(w=>i.hay.includes(w))).slice(0,14);
  body.hidden=true;box.hidden=false;
  box.innerHTML=hits.length?hits.map(h=>`<a class="res" href="#/${h.s.id}/${h.t.id}" data-focus="${h.id}"><small>${esc(h.s.title)} · ${esc(h.t.label)}</small><span>${esc(h.title)}</span></a>`).join(''):`<div class="nores">Sin resultados. Prueba con otra palabra.</div>`;
}

/* --- Router --- */
let pendingFocus=null;
function route(){
  const parts=location.hash.split('/');           // ['#','web','objeciones']
  const s=SECTIONS.find(x=>x.id===parts[1]);
  if(!s){
    app.innerHTML=home();
    const q=document.getElementById('q');
    q.addEventListener('input',e=>doSearch(e.target.value));
    window.scrollTo(0,0);
    return;
  }
  app.innerHTML=section(s,parts[2]);
  const act=app.querySelector('.tab[aria-selected=true]'), tabs=app.querySelector('.tabs');
  if(act&&tabs) tabs.scrollLeft=act.offsetLeft-(tabs.clientWidth-act.clientWidth)/2;
  const f=pendingFocus; pendingFocus=null;
  if(f){
    const el=document.getElementById(f);
    if(el){
      if(el.classList.contains('acc')||el.classList.contains('plan')){el.classList.add('open');el.querySelector('.acc-h,.inc-h').setAttribute('aria-expanded','true')}
      requestAnimationFrame(()=>{el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash')});
      return;
    }
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* --- Eventos --- */
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;font-size:16px';document.body.appendChild(a);a.select();try{document.execCommand('copy')?res():rej()}catch(e){rej()}a.remove()});
}
document.addEventListener('click',e=>{
  const tab=e.target.closest('a[data-tab]');
  if(tab){e.preventDefault();history.replaceState(null,'',tab.getAttribute('href'));route();return}
  const res=e.target.closest('a[data-focus]');
  if(res){pendingFocus=res.dataset.focus;return}
  const acc=e.target.closest('[data-act=acc]');
  if(acc){const box=acc.parentElement;const open=box.classList.toggle('open');acc.setAttribute('aria-expanded',open);return}
  const cp=e.target.closest('[data-act=copy]');
  if(cp){
    copyText(cp.dataset.text).then(()=>{
      const sp=cp.querySelector('span');cp.classList.add('done');sp.textContent='¡Copiado!';
      setTimeout(()=>{cp.classList.remove('done');sp.textContent='Copiar'},1600);
    }).catch(()=>{cp.querySelector('span').textContent='Mantén pulsado el texto'});
  }
});
route();
</script>
</body>
</html>
