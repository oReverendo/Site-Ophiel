  body{
    margin:0; min-height:100vh; min-height:100svh;
    background:var(--navy);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
    display:flex; align-items:stretch; justify-content:center;
  }
  /* Mobile (padrão): o "cartão" VIRA a tela inteira — sem bordas, sem
     cantos arredondados, sem sobra em volta. É a tela cheia mesmo. */
  .card{
    width:100%;
    /* 100svh = "small viewport height": a altura da tela JÁ DESCONTANDO
       as barras do Safari do iPhone. Com 100vh (ou 100dvh) o cartao era
       montado com a altura da tela SEM as barras, ficava mais alto do que
       o espaco realmente visivel, e por isso a pagina abria rolada — era
       preciso arrastar pra ver o topo centralizado. */
    min-height:100vh; min-height:100svh;
    background:rgba(255,250,242,.34);
    -webkit-backdrop-filter:blur(7px) saturate(1.12);
    backdrop-filter:blur(7px) saturate(1.12);
    display:flex; flex-direction:column;
    padding:40px 28px calc(18px + env(safe-area-inset-bottom));
  }
  /* Miolo do cartão: avatar + nome + botões. "flex:1" faz ele ocupar
     todo o espaço acima do rodapé, e centraliza tudo dentro desse
     espaço — o rodapé (fora daqui) fica sempre de fora dessa
     centralização, sempre colado embaixo. */
  .card-main{
    flex:1;
    display:flex; flex-direction:column;
    justify-content:center;
    justify-content:safe center;
  }
  /* Telas grandes (tablet/desktop): volta a virar um cartão flutuante
     centralizado, senão os botões ficariam esticados de ponta a ponta
     numa tela de monitor. */
  @media (min-width:560px) and (pointer:fine){
    body{ align-items:center; padding:32px 18px; }
    .card{
      width:100%; max-width:420px; min-height:auto;
      border:1px solid rgba(156,116,48,.30);
      border-radius:22px;
      padding:38px 28px 26px;
    }
    .card-main{ flex:none; }
  }

  /* ---------- APARELHO QUE MENTE ----------
     Os navegadores que vivem dentro de apps (Instagram, Facebook) mentem
     na deteccao: dizem ter mouse (pointer:fine) e abrem a pagina com a
     largura de um tablet. Com isso o cartao flutuante aparecia dentro de
     um celular, por mais que a media query acima esteja certa. Nao da
     pra ganhar isso no CSS, porque e o CSS que esta sendo enganado.
     Entao o script no fim da pagina olha o que nao se pode falsificar: a
     tela FISICA do aparelho. Se tem toque e a tela e de celular, ele
     marca <html class="toque"> e aqui a gente desfaz o cartao flutuante,
     nao importa o que o navegador tenha dito. Se o script nao rodar,
     tudo volta a valer pelo CSS, como antes. */
  html.toque body{ align-items:stretch; padding:0; }
  html.toque .card{
    max-width:none; width:100%; border:0; border-radius:0;
    min-height:100vh; min-height:100svh;
    padding:40px 28px calc(18px + env(safe-area-inset-bottom));
  }
  html.toque .card-main{ flex:1; }
  html.toque .anel-tela{ display:block; }
  html.toque .anel-cartao{ display:none; }
  /* A logo substitui o avatar redondo E o nome escrito: ela já é as
     duas coisas. Entra como SVG (vetor), então fica nítida em qualquer tela
     e herda a cor do texto por currentColor. */
  .firma{ color:var(--gold); margin:2px auto 20px; width:min(66%, 216px); }
  .firma svg, .firma img{ width:100%; height:auto; display:block;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)); }
  .avatar{
    width:112px; height:112px; border-radius:50%;
    margin:0 auto 18px; overflow:hidden;
    background:rgba(156,116,48,.08); border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar span{ font-family:Georgia, serif; font-size:42px; color:var(--gold); }
  .avatar, .biz-name{ display:none; }
  .biz-name{ text-align:center; font-size:1.3rem; font-weight:600; margin:0 0 4px; line-height:1.3; }
  /* Cada \n do subtitle vira uma linha propria. Como cada linha e um bloco
     independente, o text-align:center centraliza uma por uma — a primeira
     nao fica presa ao fluxo da segunda quando o endereco quebra sozinho. */
  .biz-sub{ text-align:center; font-size:.9rem; color:var(--ink-dim); margin:0 0 26px; }
  .biz-sub span{ display:block; }
  /* ---------- HORÁRIO ----------
     A faixa mostra sozinha se está aberto, e ao tocar abre a semana toda.
     O cálculo usa o relógio de Madrid, não o do celular do visitante: um
     turista com o telefone em outro fuso veria "aberto" na hora errada. */
  .horario{ margin:0 0 22px; }
  .horario-btn{
    display:flex; align-items:center; gap:9px; margin:0 auto;
    appearance:none; font:inherit; cursor:pointer;
    padding:8px 14px; border-radius:999px;
    background:rgba(255,252,246,.55); border:1px solid rgba(156,116,48,.35);
    color:var(--ink); font-size:.86rem; -webkit-tap-highlight-color:transparent;
    box-shadow:0 2px 10px -4px rgba(60,44,20,.35);
  }
  .horario-ponto{ width:9px; height:9px; border-radius:50%; flex:none; background:#7a6b55; }
  .horario-btn.aberto .horario-ponto{ background:#1f9e57; box-shadow:0 0 0 4px rgba(31,158,87,.20); }
  .horario-btn.fechado .horario-ponto{ background:#c4432f; box-shadow:0 0 0 4px rgba(196,67,47,.20); }
  .horario-btn .seta{ transition:transform .2s ease; opacity:.6; }
  .horario-btn.is-open .seta{ transform:rotate(180deg); }
  .horario-lista{
    list-style:none; margin:10px auto 0; padding:0 4px;
    max-width:260px; font-size:.83rem; color:var(--ink-dim);
    display:none;
  }
  .horario-lista.is-open{ display:block; }
  .horario-lista li{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  .horario-lista li.hoy{ color:var(--ink); font-weight:600; }
  .links{ display:flex; flex-direction:column; gap:12px; }
  .link-btn{
    display:flex; align-items:center; gap:12px;
    text-decoration:none; border-radius:16px;
    padding:16px 20px; min-height:58px;
    font-size:1.02rem; font-weight:600;
    border:1px solid transparent;
    position:relative; overflow:hidden;
    /* O relevo de doce vem de quatro sombras somadas:
       1) o halo colorido embaixo, na propria cor do botao (--brilho)
       2) uma borda escura fininha, que da o "apoio" no chao
       3) uma luz por dentro no topo, como o reflexo num caramelo
       4) uma sombra por dentro embaixo, que arredonda o volume */
    box-shadow:
      0 12px 22px -10px var(--brilho, rgba(0,0,0,.6)),
      0 2px 0 rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.40),
      inset 0 -3px 10px rgba(0,0,0,.18);
    transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease,
               padding .2s ease, min-height .2s ease;
  }
  /* verniz: claro em cima, escuro embaixo, por cima de qualquer cor de fundo */
  .link-btn::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.04) 46%,
                                       rgba(0,0,0,.04) 54%, rgba(0,0,0,.16));
  }
  /* reflexo que atravessa o botao quando o dedo ou o mouse passa */
  .link-btn::after{
    content:""; position:absolute; top:0; bottom:0; left:-50%; width:40%;
    border-radius:inherit; pointer-events:none;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.32), transparent);
    transition:left .55s ease;
  }
  .link-btn:hover::after, .link-btn:active::after{ left:120%; }
  /* o conteudo precisa ficar acima do verniz e do reflexo */
  .link-btn svg, .link-btn .link-label, .link-btn .link-count{ position:relative; z-index:1; }
  @media (hover:hover){
    .link-btn:hover{
      transform:translateY(-2px);
      box-shadow:
        0 18px 30px -10px var(--brilho, rgba(0,0,0,.6)),
        0 2px 0 rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.50),
        inset 0 -3px 10px rgba(0,0,0,.18);
    }
  }
  .link-btn:active{
    transform:translateY(2px) scale(.99);
    box-shadow:
      0 6px 12px -8px var(--brilho, rgba(0,0,0,.6)),
      0 1px 0 rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.30),
      inset 0 -2px 8px rgba(0,0,0,.22);
  }
  .link-btn svg{ width:21px; height:21px; flex:none; transition:opacity .15s ease; }
  .link-btn.is-featured{ outline:2px solid var(--gold-soft); outline-offset:2px; }
  .link-btn .link-label{ flex:1; }
  .link-count{ display:none; }
  /* ---------- MODO ESTATÍSTICA — o botão vira um "card" grande com o
     número de cliques em destaque, igual o exemplo que o cliente mandou,
     em vez de um numerozinho pequeno do lado. ---------- */
  .links.stats-mode .link-btn{
    flex-direction:column; justify-content:center; align-items:center;
    gap:6px; text-align:center; padding:22px 16px; min-height:88px;
  }
  .links.stats-mode .link-btn svg{ display:none; }
  .links.stats-mode .link-count{
    display:block; font-size:1.7rem; font-weight:800; line-height:1;
  }
  /* ---------- ÍCONE DE ESTATÍSTICAS ---------- */
  .card{ position:relative; }
  .stats-toggle{
    position:absolute; top:16px; right:16px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(156,116,48,.08); border:1px solid rgba(156,116,48,.3);
    color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, transform .15s ease;
  }
  .stats-toggle:active{ transform:scale(.92); }
  .stats-toggle.is-active{ background:var(--gold); color:var(--navy); border-color:var(--gold); }
  .stats-toggle svg{ width:17px; height:17px; }
  .vcard-hint{
    margin:14px 2px 0; padding:10px 12px;
    background:rgba(156,116,48,.06); border:1px solid rgba(156,116,48,.30);
    border-radius:8px; font-size:.74rem; color:var(--ink-dim); line-height:1.5;
  }
  .vcard-hint strong{ color:var(--gold-soft); }
  @media (prefers-reduced-motion: no-preference){
    @keyframes sobe{
      from{ opacity:0; transform:translateY(14px); }
      to{ opacity:1; transform:none; }
    }
    .firma, .biz-sub, .links .link-btn, .footer-credit{
      animation:sobe .62s cubic-bezier(.2,.75,.3,1) backwards;
    }
    .firma{ animation-duration:.85s; }
    .biz-sub{ animation-delay:.12s; }
    .links .link-btn{ animation-delay:calc(.2s + var(--i, 0) * 70ms); }
    .footer-credit{ animation-delay:.75s; }
  }
  /* ---------- PONTO DE LUZ NA BORDA ----------
     Um brilho fino dá a volta na moldura, sem parar.
     O truque: um gradiente cônico (que gira em torno do centro) recortado
     por uma máscara que só deixa aparecer a faixa de 2px da borda — o miolo
     fica vazado, então o brilho nunca cobre os botões, e "pointer-events:
     none" garante que ele também não rouba nenhum toque.
     Girar o ângulo de um gradiente exige declará-lo como propriedade
     animável (@property): sem isso o navegador trata o ângulo como texto e
     não sabe interpolar. Em navegador que não entende @property o brilho
     fica parado num canto — degrada feio nenhum, nada quebra.
     São dois anéis porque o cartão muda de natureza: no celular ele É a
     tela (e o anel precisa acompanhar a borda da tela, fixo, senão some
     ao rolar); no computador ele é um cartão flutuante com cantos
     arredondados, e o anel acompanha o cartão. Cada um aparece no seu. */
  @property --giro{ syntax:"<angle>"; initial-value:0deg; inherits:false; }

  .anel{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    border-radius:inherit; padding:2px;
    background:conic-gradient(from var(--giro),
        transparent 0 68%,
        rgba(156,116,48,.22) 78%,
        rgba(126,90,26,.95) 86%,
        rgba(156,116,48,.22) 94%,
        transparent 100%);
    /* duas máscaras sobrepostas: uma do tamanho do miolo e outra da caixa
       inteira. Subtraindo a primeira da segunda sobra só o anel da borda. */
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    filter:drop-shadow(0 0 6px rgba(160,120,50,.5));
    animation:girar 7s linear infinite;
  }
  @keyframes girar{ to{ --giro:360deg; } }
  .anel-cartao{ display:none; position:absolute; }
  @media (min-width:560px) and (pointer:fine){
    .anel-tela{ display:none; }
    .anel-cartao{ display:block; }
  }
  /* quem pediu menos movimento no sistema recebe só um fio dourado parado */
  @media (prefers-reduced-motion: reduce){
    .anel{ animation:none; opacity:.4; }
  }
  .footer-credit{
    text-align:center; margin-top:20px; flex:none;
    font-size:.72rem; color:rgba(122,107,85,.65);
    text-decoration:none; display:block;
    padding:8px;
  }
</style>
<script>
  /* Ver o comentario "APARELHO QUE MENTE" no CSS. navigator.maxTouchPoints e
     screen.* vem do aparelho, nao da janela, entao o navegador de dentro do
     app nao consegue disfarcar os dois. 560 e o mesmo corte da media query. */
  (function(){ try{
    var toque = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
    var tela  = Math.min(screen.width || 0, screen.height || 0);
    if (toque && tela > 0 && tela < 560)
      document.documentElement.classList.add('toque');
  }catch(e){} })();
</script>
</head>

<script>
  /* O Safari as vezes "lembra" a posicao de rolagem da ultima visita e
     reabre a pagina no meio. Aqui desligamos essa restauracao e voltamos
     ao topo no carregamento, pra pagina sempre abrir enquadrada. */
  if("scrollRestoration" in history){ history.scrollRestoration = "manual"; }
  window.addEventListener("load", () => window.scrollTo(0, 0));

  /* ============================================================
     DADOS DO CLIENTE — a ÚNICA parte que muda a cada cliente novo.
     Pra criar um cliente: duplica este arquivo, renomeia pra
     all2/NomeDaEmpresa.html, e edita só o bloco abaixo.

     "type" precisa ser um dos nomes já cadastrados no LINK_TYPES
     (veja a lista logo depois deste bloco). Se um tipo não estiver
     na lista "links" do cliente, o botão dele simplesmente não
     aparece — não precisa "desativar" nada. A cor do botão já vem
     pronta (cor oficial de cada rede), não precisa escolher cor.

     "primary" (true/false, opcional): só adiciona um contorno
     dourado de destaque em volta do botão mais importante — a
     cor de fundo continua sendo a da rede, não muda pra dourado.

     type "phone" precisa da url no formato "tel:+34600000000".
     Só dígitos e o "+", sem espaços nem parênteses.

     type "vcard" (botão "Guardar contacto") tem dois modos:

       RECOMENDADO — sobe um arquivo .vcf junto com este HTML e
       aponta a "url" pra ele: { type: "vcard", url: "cliente.vcf" }.
       Assim o servidor entrega o arquivo com o cabeçalho correto
       (Content-Type: text/vcard) e o celular abre a tela nativa de
       "Adicionar contato". É o único jeito confiável no iPhone.

       ANTIGO — sem "url", usando "name" / "phone" / "email" /
       "website", o arquivo é montado na hora pelo navegador. Ainda
       funciona, mas de forma irregular: sem o cabeçalho do servidor
       o celular às vezes só baixa um arquivo solto em vez de abrir
       o contato. Só use se não puder hospedar o .vcf.

     "photo" (foto ou logo do cliente): aceita duas coisas —
       a) o nome de um arquivo de imagem que vá subir junto com este
          HTML (ex: "logo.jpg"); ou
       b) a imagem inteira embutida aqui dentro, em base64
          ("data:image/jpeg;base64,....."). É o formato usado nos
          clientes atuais: o HTML vira um arquivo único, que não
          quebra se a imagem sumir do servidor.

     COMO PREPARAR A IMAGEM (importante): o avatar é um CÍRCULO e a
     imagem é recortada por "cover", ou seja, tudo que sobrar fora do
     círculo é cortado. Então prepare sempre uma imagem QUADRADA
     (340x340 já basta) com o assunto centralizado:
       - Logo retangular: recorte as margens vazias que sobram em
         volta e monte-a centralizada num quadrado preenchido com a
         MESMA cor de fundo da logo. A emenda fica invisível e a logo
         aproveita todo o círculo.
       - Logo que já é redonda: recorte exatamente na borda do
         círculo dela — aí o aro da logo casa com a borda do avatar.
       - Foto de pessoa: recorte quadrado fechado no rosto.
     Deixe uma folga nas pontas: os quatro cantos do quadrado sempre
     somem no recorte redondo, então nada importante pode ficar lá.

     Deixando "photo" vazio (""), o avatar mostra automaticamente a
     primeira letra do nome do cliente em dourado.

     "slug": identificador único e curto do cliente (sem espaço,
     sem acento — ex: "bluemare", "sudokisushi"). É usado só pra dar
     nome aos contadores de clique de cada botão, então dois clientes
     diferentes nunca misturam estatística um do outro.
     ============================================================ */
  const CONFIG = {
    slug: "ophiel",
    name: "Ophiel",
    subtitle: "Diseño web · Redes sociales · Impresión 3D\n📍Carr. de Málaga, 41\nBalanegra, Almería, España",
    photo: "",
    // horário do perfil do Google da Ophiel: 09:00–18:00 de lunes a
    // viernes (jornada contínua), sábado só de manhã, domingo cerrado.
    // Lista por dia, começando no domingo; [] = fechado.
    zonaHoraria: "Europe/Madrid",
    horario: [
      [],                       // domingo — cerrado
      [["09:00","18:00"]],      // lunes
      [["09:00","18:00"]],      // martes
      [["09:00","18:00"]],      // miércoles
      [["09:00","18:00"]],      // jueves
      [["09:00","18:00"]],      // viernes
      [["09:00","14:00"]]       // sábado
    ],
    links: [
      { type: "google",    url: "https://g.page/r/CXnYmZtxrguaEBM/review", primary: true,
        bg: "#1b1611", color: "#f7f1e4", glow: "rgba(27,22,17,.45)" },
      { type: "placa",     url: "https://www.ophiel.eu" },
      { type: "instagram", url: "https://www.instagram.com/ophiel.es" },
      { type: "whatsapp",  url: "https://wa.me/34602711318" },
      { type: "tiktok",    url: "https://www.tiktok.com/@ophiel.br" },
      { type: "facebook",  url: "https://www.facebook.com/profile.php?id=61594363356443" },
      { type: "website",   url: "https://ophiel.es" },
      { type: "phone",     url: "tel:+34602711318" }
    ]
  };

  /* ---------------------------------------------------------
     CONTADOR DE CLIQUES — trocamos de serviço nesta correção.

     Usávamos o CounterAPI (counterapi.dev v2), mas na prática ele
     nunca funcionou aqui: a versão atual da API deles EXIGE um token
     de autenticação em toda chamada, e o navegador bloqueia isso por
     CORS quando a chamada vem direto do JavaScript do site (a própria
     documentação deles recomenda usar um servidor por trás pra isso —
     o que não faz sentido pra um site estático simples como este).
     Ou seja: os cliques nunca estavam sendo contados de verdade.

     Trocamos pelo CountAPI (countapi.mileshilliard.com) — mesmo
     princípio, mas público, sem conta, sem chave e sem servidor
     próprio: funciona direto do navegador. Não precisa configurar
     nada aqui embaixo pra isso funcionar.

     Importante: por ser público e sem login, é um contador "de
     curiosidade" (tipo os contadores de visita antigos de site) —
     qualquer pessoa que soubesse o nome exato do contador poderia,
     em teoria, inflar o número. Não é à prova de fraude, então serve
     como indicador aproximado de engajamento, não pra decisões
     críticas de negócio.
     --------------------------------------------------------- */
  const COUNTER_BASE = "https://countapi.mileshilliard.com/api/v1";

  function trackClick(counterName){
    fetch(`${COUNTER_BASE}/hit/${counterName}`).catch(() => {}); // falha silenciosa — nunca deve travar o clique do visitante
  }

  /* ---------------------------------------------------------
     CATÁLOGO DE REDES DISPONÍVEIS — não precisa mexer aqui pra

      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg>' },
    placa:     { label: "Compra tu placa", bg: "linear-gradient(45deg,#0d9488,#4f46e5,#a855f7)", glow: "rgba(109,78,232,.75)", color: "#ffffff",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><path d="M12.5 9.5a3.6 3.6 0 0 1 0 5M15.3 7.4a7 7 0 0 1 0 9.2"/></svg>' },
    instagram: { label: "Instagram", bg: "linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)", glow: "rgba(214,41,118,.75)", color: "#ffffff",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>' },
    facebook:  { label: "Facebook", bg: "#1877F2", glow: "rgba(24,119,242,.75)", color: "#ffffff",
      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H7v3h3v6h3v-6h3l1-3h-4v-2c0-.6.4-1 1-1z"/></svg>' },
    tiktok:    { label: "TikTok", bg: "#010101", glow: "rgba(255,255,255,.30)", color: "#ffffff",
      icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3v10.2a2.8 2.8 0 1 1-2-2.7V8.4a5 5 0 1 0 4 4.9V8a5.2 5.2 0 0 0 3 1V6.8A3.4 3.4 0 0 1 16.5 3H14z"/></svg>' },
    whatsapp:  { label: "WhatsApp", bg: "#25D366", glow: "rgba(37,211,102,.70)", color: "#06301a",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>' },
    phone:     { label: "Llamar", bg: "rgba(255,250,242,.5)", glow: "rgba(156,116,48,.35)", color: "#7d5c22", border: "1px solid rgba(156,116,48,.3)",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>' },
    email:     { label: "Email", bg: "rgba(255,250,242,.5)", glow: "rgba(156,116,48,.35)", color: "#7d5c22", border: "1px solid rgba(156,116,48,.3)",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>' },
    website:   { label: "Sitio web", bg: "var(--gold)", glow: "rgba(156,116,48,.65)", color: "#efe6d7",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>' },
    maps:      { label: "Cómo llegar", bg: "#34A853", glow: "rgba(52,168,83,.70)", color: "#ffffff",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>' },
    booking:   { label: "Reservar", bg: "#1F3B57", glow: "rgba(31,59,87,.85)", color: "#ffffff",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>' },
    custom:    { label: "Enlace", bg: "rgba(156,116,48,.08)", glow: "rgba(156,116,48,.35)", color: "#7d5c22", border: "1px solid rgba(156,116,48,.3)",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg>' },
    vcard:     { label: "Guardar contacto", bg: "rgba(156,116,48,.08)", glow: "rgba(156,116,48,.35)", color: "#7d5c22", border: "1px solid rgba(156,116,48,.3)",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M6 16c.5-1.7 1.8-2.5 3-2.5s2.5.8 3 2.5M14 9h4M14 13h4"/></svg>' }
  };

  document.title = CONFIG.name;
  document.getElementById("pageTitle").textContent = CONFIG.name;
  document.getElementById("bizName").textContent = CONFIG.name;
  // o subtitle pode ter varias linhas, separadas por \n no CONFIG
  const subEl = document.getElementById("bizSub");
  subEl.textContent = "";
  (CONFIG.subtitle || "").split("\n").forEach((linha) => {
    const s = document.createElement("span");
    s.textContent = linha;
    subEl.appendChild(s);
  });

  const avatarEl = document.getElementById("avatar");
  if(CONFIG.photo){
    avatarEl.innerHTML = `<img src="${CONFIG.photo}" alt="${CONFIG.name}">`;
  } else {
    avatarEl.innerHTML = `<span>${(CONFIG.name || "?").trim().charAt(0).toUpperCase()}</span>`;
  }

  /* Monta o arquivo de contato (vCard) na hora — o celular reconhece
     esse formato e já abre a tela nativa de "Adicionar aos contatos",
     sem precisar de nenhum app ou servidor por trás. */
  // Detecta iPhone/iPad — o Safari deles se comporta diferente de tudo
  // mais (Android, desktop) na hora de reconhecer um cartão de contato.
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  function buildVCardHref(link){
    const name = link.name || CONFIG.name || "";
    const org = link.org || CONFIG.name || "";
    const lines = ["BEGIN:VCARD", "VERSION:3.0", `N:;${name};;;`, `FN:${name}`, `ORG:${org}`];
    if(link.phone) lines.push(`TEL;TYPE=CELL:${link.phone}`);
    if(link.email) lines.push(`EMAIL:${link.email}`);
    if(link.website) lines.push(`URL:${link.website}`);
    lines.push("END:VCARD");
    const vcardText = lines.join("\r\n"); // vCard exige quebra de linha CRLF

    if(isIOS()){
      // No iPhone/iPad, um link "data:" SEM o atributo "download" é o que
      // faz o Safari reconhecer o conteúdo como contato e abrir a tela
      // nativa de "Adicionar Contato" direto. Com "download" forçado
      // (que ajuda no Android), o Safari ignora esse reconhecimento e só
      // baixa um arquivo cru — por isso os dois casos são tratados diferente.
      return "data:text/vcard;charset=utf-8," + encodeURIComponent(vcardText);
    }
    // Fora do iOS (Android e a maioria dos outros), um arquivo de verdade
    // (Blob) é mais confiável — o link "data:" às vezes é ignorado.
    const blob = new Blob([vcardText], { type: "text/vcard;charset=utf-8" });
    return URL.createObjectURL(blob);
  }

  /* ============================================================
     HORÁRIO DE ATENDIMENTO
     "horario" no CONFIG: uma lista por dia, começando no domingo.
     Cada dia é uma lista de turnos ["abre","fecha"]; dia fechado = [].
     Dois turnos no mesmo dia: [["09:00","14:00"],["17:00","20:30"]].
     Turno que vira a noite (fecha depois da meia-noite) também funciona:
     ["20:00","02:00"] é entendido como madrugada do dia seguinte.
     ============================================================ */
  const DIAS_NOME = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

  function emMinutos(hhmm){
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + m;
  }

  // que horas são no fuso do estabelecimento (não no do celular de quem visita)
  function agoraNoLocal(zona){
    const p = new Intl.DateTimeFormat("en-GB", {
      timeZone: zona, weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date());
    const achar = (t) => p.find((x) => x.type === t).value;
    const idx = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 }[achar("weekday")];
    return { dia: idx, min: (Number(achar("hour")) % 24) * 60 + Number(achar("minute")) };
  }

  function estadoHorario(horario, zona){
    const { dia, min } = agoraNoLocal(zona);
    const ontem = (dia + 6) % 7;

    // turno de ontem que atravessou a meia-noite e ainda está correndo
    for(const [abre, fecha] of (horario[ontem] || [])){
      const a = emMinutos(abre), f = emMinutos(fecha);
      if(f <= a && min < f) return { aberto: true, fecha };
    }
    for(const [abre, fecha] of (horario[dia] || [])){
      const a = emMinutos(abre), f = emMinutos(fecha);
      if(min >= a && (f <= a || min < f)) return { aberto: true, fecha };
      if(min < a) return { aberto: false, quando: "hoy", abre };
    }
    // fechado pelo resto do dia: procura o próximo dia com turno
    for(let i = 1; i <= 7; i++){
      const d = (dia + i) % 7;
      const turnos = horario[d] || [];
      if(turnos.length){
        const quando = i === 1 ? "mañana" : `el ${DIAS_NOME[d]}`;
        return { aberto: false, quando, abre: turnos[0][0] };
      }
    }
    return null;
  }

  (function montarHorario(){
    const caixa = document.getElementById("horario");
    if(!caixa || !CONFIG.horario) return;
    const zona = CONFIG.zonaHoraria || "Europe/Madrid";
    const est = estadoHorario(CONFIG.horario, zona);
    if(!est) return;

    const btn = document.getElementById("horarioBtn");
    const txt = document.getElementById("horarioTexto");
    const lista = document.getElementById("horarioLista");

    btn.classList.add(est.aberto ? "aberto" : "fechado");
    txt.textContent = est.aberto
      ? `Abierto ahora · cierra a las ${est.fecha}`
      : `Cerrado · abre ${est.quando} a las ${est.abre}`;

    const hoy = agoraNoLocal(zona).dia;
    const ordem = [1, 2, 3, 4, 5, 6, 0];   // a semana começa na segunda
    lista.innerHTML = ordem.map((d) => {
      const turnos = (CONFIG.horario[d] || []);
      const texto = turnos.length
        ? turnos.map(([a, f]) => `${a}–${f}`).join(" · ")
        : "Cerrado";
      return `<li class="${d === hoy ? "hoy" : ""}"><span>${DIAS_NOME[d]}</span><span>${texto}</span></li>`;
    }).join("");

    btn.addEventListener("click", () => {
      const abrir = !lista.classList.contains("is-open");
      lista.classList.toggle("is-open", abrir);
      btn.classList.toggle("is-open", abrir);
      btn.setAttribute("aria-expanded", abrir ? "true" : "false");
    });
    caixa.hidden = false;
  })();

  const listEl = document.getElementById("linksList");
  listEl.innerHTML = CONFIG.links.map((link, i) => {
    const meta = LINK_TYPES[link.type] || LINK_TYPES.custom;
    const label = link.label || meta.label;
    const bg = link.bg || meta.bg;
    const color = link.color || meta.color;
    const border = meta.border ? `border:${meta.border};` : "";
    // --brilho e a cor do halo colorido embaixo do botao. Se o tipo nao
    // trouxer uma, usa a propria cor de fundo quando ela for solida.
    const brilho = link.glow || meta.glow ||
      (typeof bg === "string" && bg.trim().charAt(0) === "#" ? bg : "rgba(0,0,0,.55)");
    const featuredCls = link.primary ? "is-featured" : "";
    const isVCard = link.type === "vcard";
    // vCard hospedado (link.url apontando pra um .vcf que está no servidor)
    // é um link comum: quem diz ao celular que aquilo é um contato é o
    // cabeçalho Content-Type que o servidor manda junto. Por isso ele não
    // leva target, nem download, nem passa pelo buildVCardHref.
    const isHostedVCard = isVCard && !!link.url;
    const href = (isVCard && !isHostedVCard) ? buildVCardHref(link) : link.url;
    // no iPhone, abrir o vCard MONTADO NA HORA numa aba nova costuma
    // disparar a prévia nativa de contato com mais confiabilidade
    // tel:, mailto: e sms: NÃO podem levar target="_blank" — o celular
    // precisa "entregar" esses links pro app nativo (discador, email), e
    // abrir numa aba nova atrapalha: no Chrome/Safari deixa uma aba em
    // branco para trás, e nos navegadores internos do Instagram/Facebook
    // simplesmente não acontece nada. Sites normais (http/https) continuam
    // abrindo em aba nova pra não tirar o visitante da página de links.
    const isAppLink = /^(tel:|mailto:|sms:)/i.test(link.url || "");
    const targetAttrs = isHostedVCard ? ""
      : isVCard ? (isIOS() ? 'target="_blank"' : "")
      : (isAppLink ? "" : 'target="_blank" rel="noopener"');
    const downloadAttr = (isVCard && !isHostedVCard && !isIOS()) ? `download="${(link.name || CONFIG.name || "contacto").replace(/[^a-z0-9]/gi, "-")}.vcf"` : ""; // no iPhone/iPad, NÃO força download — deixa o Safari reconhecer o contato sozinho
    const counterName = (link.counterName || `ophiel-${CONFIG.slug}-${link.type}`).replace(/[^a-z0-9-]/gi, "-");
    return `<a href="${href}" ${targetAttrs} ${downloadAttr} onclick="trackClick('${counterName}')" data-counter="${counterName}" class="link-btn ${featuredCls}" style="--i:${i}; background:${bg}; color:${color}; --brilho:${brilho}; ${border}">${meta.icon}<span class="link-label">${label}</span><span class="link-count" hidden></span></a>`;
  }).join("");

  // A dica de "Archivos → Añadir a contactos" só faz sentido no modo
  // ANTIGO (vCard montado na hora) e num iPhone/iPad. Com o .vcf
  // hospedado o contato abre sozinho, e no Android e no computador o
  // fluxo já funciona liso — nos dois casos a dica só confundiria.
  const hasGeneratedVCard = CONFIG.links.some((l) => l.type === "vcard" && !l.url);
  if(hasGeneratedVCard && isIOS()){
    document.getElementById("vcardHint").hidden = false;
  }

  /* ---------- ÍCONE DE ESTATÍSTICAS ---------- */
  // busca (sem somar!) o valor atual de cada contador e mostra um
  // número ao lado de cada botão — alterna ligado/desligado no clique
  const statsToggle = document.getElementById("statsToggle");
  let statsOn = false;
  let statsLoaded = false;

  async function fetchCounterValue(counterName){
    try{
      const res = await fetch(`${COUNTER_BASE}/get/${counterName}`);
      if(!res.ok){
        console.warn(`[stats] "${counterName}" respondió ${res.status}.`);
        return null;
      }
      const json = await res.json();
      const value = json?.value;
      if(value === undefined || value === null){
        console.warn(`[stats] "${counterName}" respondió pero no encontramos el número de clics — formato inesperado:`, json);
        return null;
      }
      return Number(value);
    } catch(e) {
      console.warn(`[stats] "${counterName}" falló al cargar:`, e);
      return null;
    }
  }

  async function loadStats(){
    const badges = document.querySelectorAll(".link-count");
    badges.forEach((b) => { b.textContent = "…"; });
    await Promise.all(Array.from(badges).map(async (badge) => {
      const btn = badge.closest("[data-counter]");
      const counterName = btn?.dataset.counter;
      if(!counterName) return;
      const value = await fetchCounterValue(counterName);
      badge.textContent = value === null ? "—" : `${value} ${value === 1 ? "clic" : "clics"}`;
    }));
    statsLoaded = true;
  }

  if(statsToggle){
    statsToggle.addEventListener("click", async () => {
      statsOn = !statsOn;
      statsToggle.classList.toggle("is-active", statsOn);
      listEl.classList.toggle("stats-mode", statsOn);
      if(statsOn && !statsLoaded){
        await loadStats();
      }
    });
  }
</script>
